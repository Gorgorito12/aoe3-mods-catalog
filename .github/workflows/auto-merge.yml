# Validate mod-catalog PRs and hand a decision to the companion workflow.
#
# Pipeline (jobs depend in this order):
#
#   1. classify - look at the diff AND at who the author is, decide the outcome,
#                 then record it as an artifact for the companion workflow.
#   2. validate - JSON Schema + image spec checks. Only runs for the outcomes
#                 where a manifest is actually in play ('owner', 'tier3').
#
# This workflow runs under `pull_request`, which means that on a FORK PR its
# GITHUB_TOKEN is READ-ONLY no matter what `permissions:` declares. So nothing
# here may depend on write access. The privileged half — enabling auto-merge,
# labelling, and commenting the outcome back to the contributor — lives in
# auto-merge-apply.yml, which GitHub runs from the DEFAULT BRANCH on
# `workflow_run` with a writable token and which never checks out PR code.
#
# The merge is blocked by `classify` exiting non-zero (it is a required check),
# never by a job that merely goes red: a non-required job's red X does not stop
# branch protection, and a *skipped* required check counts as passing.
#
# What it explicitly does NOT do:
#   - It never auto-approves a PR. Required-approvals on the branch must be 0;
#     GITHUB_TOKEN cannot approve pull requests by design.
#   - It never deletes or force-pushes anything.

name: Validate and auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Deliberately read-only. Every write lives in auto-merge-apply.yml — see header.
permissions:
  contents: read

# Cancel an in-flight run when a new commit lands on the same PR. Saves minutes
# and avoids a stale decision being applied after the diff changed (the companion
# workflow also re-checks the head SHA before acting).
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # -- 1. Decide what kind of change this PR is making ----------------------
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      mod_id: ${{ steps.classify.outputs.mod_id }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout (full history for diffs)
        uses: actions/checkout@v4
        with:
          # Need both base and head to diff. Default fetch-depth=1 only
          # fetches the head commit, which breaks `git diff base...head`.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Run the BASE branch's classifier, never the PR's own copy. On a fork PR
      # the checked-out scripts come from the fork, so without this a malicious
      # PR could rewrite classify_pr.py to declare itself authorized (or downgrade
      # a critical change to auto-merge). The workflow YAML is always taken from
      # base, but the scripts it invokes are not — pin them explicitly.
      - name: Pin classifier to the base branch (don't trust the PR's copy)
        run: git checkout "origin/${{ github.event.pull_request.base.ref }}" -- .github/scripts/classify_pr.py

      - name: Classify PR
        id: classify
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Pin the diff AND the ownership read to the commit the PR targets.
          # Against the live origin/<base> tip, a PR merged by hand while this run
          # is queued makes the diff come back EMPTY and makes `maintainers` be
          # read from the PR's own copy — which voids the whole ownership gate.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python .github/scripts/classify_pr.py

      # Hand the decision to the companion workflow. Written here, in the job that
      # runs NO PR-authored code, so the PR cannot author its own verdict — the
      # `validate` job below does run PR content and must never write this.
      # `always()` because 'unauthorized' and 'invalid' exit non-zero on purpose
      # and the contributor still deserves the explanation comment.
      - name: Record the decision for the companion workflow
        if: always() && steps.classify.outputs.tier != ''
        env:
          TIER: ${{ steps.classify.outputs.tier }}
          MOD_ID: ${{ steps.classify.outputs.mod_id }}
          REASON: ${{ steps.classify.outputs.reason }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p decision
          {
            printf 'pr_number=%s\n' "$PR_NUMBER"
            printf 'head_sha=%s\n'  "$HEAD_SHA"
            printf 'tier=%s\n'      "$TIER"
            printf 'mod_id=%s\n'    "$MOD_ID"
            printf 'reason=%s\n'    "$REASON"
          } > decision/decision.txt
          cat decision/decision.txt

      - name: Upload the decision
        if: always() && steps.classify.outputs.tier != ''
        uses: actions/upload-artifact@v4
        with:
          name: pr-decision
          path: decision/decision.txt
          retention-days: 1

  # -- 2. Validate the manifest + assets ------------------------------------
  # Only the outcomes that actually involve a manifest. 'infra' and
  # 'already-merged' have nothing to validate; 'invalid' / 'unauthorized' /
  # 'error' already failed `classify`, which is the required check.
  validate:
    name: Validate manifest and assets
    needs: classify
    if: contains(fromJSON('["owner", "tier3"]'), needs.classify.outputs.tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job runs PR-authored content and a green result here is what
          # authorises the companion workflow to merge. Leave no credentials in
          # the checkout for that content to find.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same reasoning as the classifier pin above: the schema and the image
      # validator decide whether a PR may merge, so they must come from the base
      # branch. Without this a fork could ship a permissive schema (or an
      # always-passing validate_images.py) alongside its own manifest.
      - name: Pin validators to the base branch (don't trust the PR's copy)
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          git checkout FETCH_HEAD -- schema/mod.schema.json .github/scripts/validate_images.py

      - name: Install validators
        # ajv-cli for JSON Schema; Pillow for image-spec checks.
        run: |
          npm install -g ajv-cli@5 ajv-formats@3
          pip install --quiet Pillow

      - name: Validate JSON Schema
        # --strict=false because draft-07 + ajv strict mode is overzealous
        # about unknown formats; we already pin draft-07 in the schema.
        run: >
          ajv validate
          -s schema/mod.schema.json
          -d "mods/**/mod.json"
          -c ajv-formats
          --strict=false

      - name: Validate image specs
        run: python .github/scripts/validate_images.py
